[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2app"
version = "0.1.0"
description = "Paper2App competition build"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
